services:
  postgres:
    image: postgres:16-alpine
    container_name: galvano-lims-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: galvano_lims
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c tcp_keepalives_idle=60
      -c tcp_keepalives_interval=10
      -c tcp_keepalives_count=6
      -c idle_in_transaction_session_timeout=30000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: galvano-lims-server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/galvano_lims?schema=public&connection_limit=10&pool_timeout=30&connect_timeout=30
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: dev-jwt-refresh-secret-change-in-production
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:5173
      GUS_ENABLED: "true"
      GUS_BIR_URL: https://wyszukiwarkaregon.stat.gov.pl/wsBIR/UslugaBIRzewnPubl.svc
      GUS_BIR_KEY: "d51d4dd7a07e417fb746"
      GUS_TIMEOUT_MS: "12000"
      UPLOAD_DIR: ./uploads
      REPORTS_DIR: ./reports
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - server_uploads:/app/uploads
      - server_reports:/app/reports

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: galvano-lims-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  postgres_data:
  server_uploads:
  server_reports:
